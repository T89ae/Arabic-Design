kind = "web"
previewPath = "/"
title = "نظام حلول للخدمات العامة"
version = "1.0.0"
id = "artifacts/hulul-system"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24310

[services.development]
run = "pnpm --filter @workspace/hulul-system run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hulul-system", "run", "build" ]
publicDir = "artifacts/hulul-system/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24310"
BASE_PATH = "/"
